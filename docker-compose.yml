version: '3.8'

services:
  app1:
    image: php:8.2-cli
    volumes:
      - ./src:/app
    working_dir: /app
    command: php -S 0.0.0.0:8000 servidor.php 8000
    expose:
      - "8000"

  app2:
    image: php:8.2-cli
    volumes:
      - ./src:/app
    working_dir: /app
    command: php -S 0.0.0.0:8001 servidor1.php 8001
    expose:
      - "8001"

  app3:
    image: php:8.2-cli
    volumes:
      - ./src:/app
    working_dir: /app
    command: php -S 0.0.0.0:8002 servidor2.php 8002
    expose:
      - "8002"

  nginx:
    image: nginx:latest
    ports:
      - "8090:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3