events { worker_connections 1024; }

http {
    upstream backend_cluster {
    server app1:8000;
    server app2:8001;
    server app3:8002;
    }
    
    server {
        listen 8080; 

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}